services:
  db-documentador:
    build: .
    restart: unless-stopped
    environment:
      # Coolify: gera o domínio e roteia 80/443 do proxy para a porta interna 8080
      SERVICE_FQDN_DBDOC_8080: ${SERVICE_FQDN_DBDOC_8080:-}
      MSSQL_HOST: ${MSSQL_HOST}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      DATABASES: ${DATABASES:-}
      EXCLUDE_DATABASES: ${EXCLUDE_DATABASES:-}
      SCHEMAS: ${SCHEMAS:-all}
      ROW_COUNTS: ${ROW_COUNTS:-true}
      PARALLEL: ${PARALLEL:-2}
      RUN_EVERY_HOURS: ${RUN_EVERY_HOURS:-168}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx1g}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      SAMPLE_ROWS: ${SAMPLE_ROWS:-20}
      SAMPLE_VIEWS: ${SAMPLE_VIEWS:-false}
      SAMPLE_MASK_REGEX: ${SAMPLE_MASK_REGEX-senha|password|pass|pwd|hash|salt|token|secret|chave|cpf|cnpj|rg|cartao|card}
      SAMPLE_TIMEOUT: ${SAMPLE_TIMEOUT:-30}
      SQL_CONSOLE: ${SQL_CONSOLE:-false}
      SQL_CONSOLE_USER: ${SQL_CONSOLE_USER:-}
      SQL_CONSOLE_PASSWORD: ${SQL_CONSOLE_PASSWORD:-}
      SQL_CONSOLE_TIMEOUT: ${SQL_CONSOLE_TIMEOUT:-30}
      SQL_CONSOLE_MAX_ROWS: ${SQL_CONSOLE_MAX_ROWS:-1000}
      CONSOLE_ADMIN_ENABLED: ${CONSOLE_ADMIN_ENABLED:-false}
      CONSOLE_ADMIN_USER: ${CONSOLE_ADMIN_USER:-}
      CONSOLE_ADMIN_PASSWORD: ${CONSOLE_ADMIN_PASSWORD:-}
      CONSOLE_ADMIN_SQL_USER: ${CONSOLE_ADMIN_SQL_USER:-}
      CONSOLE_ADMIN_SQL_PASSWORD: ${CONSOLE_ADMIN_SQL_PASSWORD:-}
      CONSOLE_ADMIN_TOKEN_TTL: ${CONSOLE_ADMIN_TOKEN_TTL:-120}
      CONSOLE_ADMIN_ALLOW_SISTEMA: ${CONSOLE_ADMIN_ALLOW_SISTEMA:-false}
      CONSOLE_ADMIN_ALLOW_SISTEMA_ATE: ${CONSOLE_ADMIN_ALLOW_SISTEMA_ATE:-}
      SITE_TITLE: ${SITE_TITLE:-Documentação dos bancos}
    volumes:
      - docs:/output
      - audit:/audit
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  docs:
  audit:
